# Gate 1: AMECO Spring 2026 immutable snapshot. PENDING USER APPROVAL (nothing downloaded yet).
# Probed 2026-10-10 with HEAD requests and one-byte ranged GETs only (sizes), plus page reads.
# size_basis: measured = total size read from Content-Range (enforced exactly);
#             page_stated = size printed on the provider page (approximate, not enforced);
#             estimated = my estimate from row counts (NOT measured, not enforced);
#             unknown = not available before download.

