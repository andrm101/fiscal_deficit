# Gate 4 (Stage C): controls and secondary outcomes from Eurostat. PENDING USER APPROVAL, NOTHING DOWNLOADED.
# Dimension orders verified on 2026-10-10 from the official ESTAT data structure definitions:
#   gov_10a_main / gov_10a_exp / gov_10dd_edpt1 -> freq.unit.sector.na_item.geo (gov_10a_exp inserts cofog99 before na_item per Appendix B)
#   nama_10_gdp                                 -> freq.unit.na_item.geo
# Code values (B9, D41PAY, TR, TE, D62PAY, D632PAY, GF10, GF1002, GF07, GD, B1GQ, CP_MEUR, PC_GDP, MIO_EUR) were seen in live responses
# by the Appendix B scout, not in the structure files (which only reference codelists). The metadata test after download must confirm them.
# startPeriod=1993: the interest-growth control is lagged one year and uses lagged debt and nominal GDP growth.
# All sizes are my estimates (rows x about 200 B); none measured.

[release]
source_id = "eurostat_controls"
vintage = "2026-10-10_probe"
release_label = "Eurostat government finance, COFOG, EDP debt, national accounts; EU-27, 1993-2025"
manifest_dir = "data/raw/eurostat_controls"
provider = "Eurostat"
landing_page = "https://ec.europa.eu/eurostat/web/government-finance-statistics"

[[file]]
id = "S01"
role = "secondary outcomes and mechanism: B9, D41PAY, TR, TE, D62PAY, D632PAY, % of GDP, S13"
url = "https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/gov_10a_main/A.PC_GDP.S13.B9+D41PAY+TR+TE+D62PAY+D632PAY.AT+BE+BG+CY+CZ+DE+DK+EE+EL+ES+FI+FR+HR+HU+IE+IT+LT+LU+LV+MT+NL+PL+PT+RO+SE+SI+SK?startPeriod=1993&endPeriod=2025&format=SDMX-CSV&compressed=false"
dest = "data/raw/eurostat_controls/gov_10a_main_pc_gdp_1993_2025.csv"
content_type = "application/vnd.sdmx.data+csv"
expected_size_bytes = 1100000
size_basis = "estimated"
licence_status = "Eurostat reuse with source acknowledgement"
note = "Flags in OBS_FLAG (p, b). Negative values must survive parsing (R01)."

