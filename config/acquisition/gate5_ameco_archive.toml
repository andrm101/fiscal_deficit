# Gate 5: AMECO archive vintages Autumn 2014 to Autumn 2025, for the real-time CAPB feasibility check (S4, trigger T3).
# Approved by the researcher ("Do AMECO", 2026-10-10) after the scale (about two dozen zips) was stated. Sizes: the three newest files were
# measured (Content-Range); the other 23 report no total before download, so their size is unknown (expect roughly 6-7 MB each).
# Methodology note (Appendix B 1.3): the cyclical-adjustment method is homogeneous only from Autumn 2014. The printed date of "Autumn 2025"
# (3 June 2025) looks wrong; its internal date is checked after download.

[release]
source_id = "ameco_archive"
vintage = "autumn2014_to_autumn2025"
release_label = "AMECO archive, 26 zipped text vintages (Autumn 2014 ... Autumn 2025)"
manifest_dir = "data/raw/ameco_archive"
provider = "European Commission, DG ECFIN"
landing_page = "https://economy-finance.ec.europa.eu/economic-research-and-databases/economic-databases/ameco-database/ameco-archive_en"

